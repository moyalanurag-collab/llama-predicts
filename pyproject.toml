[project]
name = "ufc-edge"
version = "0.1.0"
description = "UFC fight prediction and value-betting system with strict bankroll protection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["beautifulsoup4>=4.12", "pandas>=2.0", "scikit-learn>=1.3"]  # the Stage 1 core itself is stdlib-only

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["ufc_edge", "ufc_edge.data", "ufc_edge.features", "ufc_edge.model", "ufc_edge.dashboard"]

[tool.setuptools.package-data]
"ufc_edge.dashboard" = ["static/*", "static/fonts/*", "static/img/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
